# KOS-Lab Runtime Configuration
# This file is the live configuration mirror of the Runtime Emulator.

runtime:
  name: KOS Runtime Emulator
  mode: laboratory
  execution_id: runtime-execution-001
  supervisor_id: runtime-supervisor-001
  session_id: lab-session-001

report_generator:
  auto_publish_issue: true
  github_issue_template: KOS-Lab State Report
  include_ascii_progress: true
  include_execution_status: true
  include_clock: true
  include_local_time: true
  include_confidence_symbols: true
  output_formats:
    - console
    - markdown
    - github_issue
    - json

clock:
  source: github_runtime_state
  timezone_storage: UTC
  timezone_display: Europe/Madrid
  local_time_display: true
  confidence_mode: enabled
  fallbacks:
    - git_commit_timestamp
    - system_clock

state_reporting:
  auto_sync_issue: true
  auto_sync_repository: true
  registry_update: true
  task_timeline: true
  execution_timeline: true
  health_timeline: true

confidence:
  verified_symbol: "✓"
  estimated_symbol: "◊"
  unavailable_symbol: "¿?"
  invalid_symbol: "✗"

kcp:
  enabled: true
  protocol_version: 1.0
  active_message_types:
    - command
    - query
    - report
    - event
    - ack
    - nack

repositories:
  mirror_repo: rgaricano/KOS-Lab
  mirror_mode: github_first
  sync_scope:
    - governance/
    - adr/
    - tasks/
    - reports/
    - runtime/
    - architecture/
    - discussions/
    - registries/
